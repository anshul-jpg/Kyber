    <text x="174" y="262" text-anchor="middle" font-family="'Geist Mono', Consolas, monospace" font-size="11" fill="#71717a">Zero Install • Instant PWA</text>

    <!-- Mesh Endpoints -->
    <g transform="translate(24, 286)">
      <rect width="300" height="42" rx="6" fill="#18191d" stroke="rgba(255,255,255,0.06)" />
      <circle cx="16" cy="21" r="3.5" fill="#38bdf8" />
      <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#d4d4d8">Tailscale Mesh (Remote)</text>
      <text x="28" y="32" font-family="'Geist Mono', Consolas, monospace" font-size="10" fill="#71717a">100.92.14.8:4040 • E2EE Encrypted</text>
    </g>

    <g transform="translate(24, 336)">
      <rect width="300" height="42" rx="6" fill="#18191d" stroke="rgba(255,255,255,0.06)" />
      <circle cx="16" cy="21" r="3.5" fill="#22c55e" />
      <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#d4d4d8">Local Wi-Fi (Home / Office)</text>
      <text x="28" y="32" font-family="'Geist Mono', Consolas, monospace" font-size="10" fill="#71717a">192.168.1.42:4040 • Zero Latency</text>
    </g>
  </g>

  <!-- Panel 3: Mobile Phone Companion View (Right) -->
  <g transform="translate(802, 100)">
    <rect width="350" height="400" rx="8" fill="#121316" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <path d="M 0 8 Q 0 0 8 0 L 342 0 Q 350 0 350 8 L 350 36 L 0 36 Z" fill="#18191d" />
    <text x="18" y="22" font-family="'Geist Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#38bdf8">MOBILE COMPANION (PHONE VIEW)</text>

    <!-- Mobile Tool Approval Card -->
    <g transform="translate(18, 52)">
      <rect width="314" height="200" rx="8" fill="#18191d" stroke="rgba(255,255,255,0.1)" />
      
      <!-- Card Header -->
      <rect x="14" y="14" width="70" height="20" rx="4" fill="rgba(234, 179, 8, 0.15)" />
      <text x="22" y="28" font-family="'Geist Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#eab308">TOOL REQ</text>
      <text x="94" y="28" font-family="'Geist Mono', Consolas, monospace" font-size="10" fill="#71717a">run_command #42</text>

      <!-- Command to Approve -->
      <text x="14" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Execute shell script</text>
      <rect x="14" y="66" width="286" height="42" rx="4" fill="#0e0f11" stroke="rgba(255,255,255,0.05)" />
      <text x="24" y="91" font-family="'Geist Mono', Consolas, monospace" font-size="11" fill="#a1a1aa">git push origin master --force</text>

