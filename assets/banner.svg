<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141517" />
      <stop offset="50%" stop-color="#0c0d0e" />
      <stop offset="100%" stop-color="#08090a" />
    </linearGradient>
    <radialGradient id="cyanCenterGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#007acc" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#007acc" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="560" fill="url(#bgGlow)" />
  <rect width="1200" height="560" fill="url(#cyanCenterGlow)" />
  <rect width="1200" height="560" fill="url(#grid)" />

  <!-- Outer Border Frame -->
  <rect x="16" y="16" width="1168" height="528" rx="12" stroke="rgba(255,255,255,0.08)" stroke-width="1" fill="none" />

  <!-- Header Section -->
  <g transform="translate(48, 42)">
    <!-- Real Kyber Helmsman Needle Glyph -->
    <g transform="translate(0, 0) scale(0.48)">
      <polygon points="48.5,18 22,58 48.5,98" fill="#ffffff" />
      <polygon points="51.5,2 78,42 51.5,82" fill="#a1a1aa" opacity="0.85" />
    </g>

    <!-- Brand Typography -->
    <text x="56" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="24" font-weight="800" letter-spacing="3" fill="#ffffff">KYBER</text>
    <text x="180" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" fill="#71717a">AUTONOMOUS POCKET SUPERVISOR</text>

    <!-- Top Right Status Indicators -->
    <rect x="880" y="10" width="224" height="26" rx="13" fill="#18181b" stroke="rgba(255,255,255,0.08)" />
    <circle cx="896" cy="23" r="4" fill="#22c55e" />
    <text x="910" y="27" font-family="'Geist Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#a1a1aa">MESH ACTIVE • PORT 4040</text>
  </g>

  <!-- Content 3-Column Layout -->

  <!-- Panel 1: Antigravity IDE Hook Interceptor (Left) -->
  <g transform="translate(48, 100)">
    <!-- Container -->
    <rect width="350" height="400" rx="8" fill="#121316" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <!-- Window Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 342 0 Q 350 0 350 8 L 350 36 L 0 36 Z" fill="#18191d" />
    <circle cx="20" cy="18" r="4" fill="#ef4444" opacity="0.8" />
    <circle cx="34" cy="18" r="4" fill="#eab308" opacity="0.8" />
    <circle cx="48" cy="18" r="4" fill="#22c55e" opacity="0.8" />
    <text x="68" y="22" font-family="'Geist Mono', Consolas, monospace" font-size="11" fill="#71717a">ANTIGRAVITY IDE // HOOK IPC</text>

    <!-- Terminal Content -->
    <g transform="translate(20, 56)">
      <text x="0" y="14" font-family="'Geist Mono', Consolas, monospace" font-size="12" fill="#38bdf8">→ agent.exec(run_command)</text>
      <text x="0" y="34" font-family="'Geist Mono', Consolas, monospace" font-size="11" fill="#71717a">$ git push origin master --force</text>

      <!-- Intercept Box -->
      <rect x="0" y="52" width="310" height="92" rx="6" fill="#18191d" stroke="#eab308" stroke-width="1" stroke-opacity="0.4" />
      <text x="14" y="74" font-family="'Geist Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#eab308">⚡ PRETOOLUSE INTERCEPTED</text>
      <text x="14" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#d4d4d8">Target: Sensitive tool execution</text>
      <text x="14" y="114" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#a1a1aa">Mode: Remote (Phone Priority)</text>
      <text x="14" y="132" font-family="'Geist Mono', Consolas, monospace" font-size="11" fill="#007acc">Status: Awaiting phone decision...</text>

      <!-- Live Stream Log Lines -->
      <g transform="translate(0, 166)">
        <text x="0" y="14" font-family="'Geist Mono', Consolas, monospace" font-size="11" fill="#52525b">[11:42:01] PreToolUse hook trigger: #42</text>
        <text x="0" y="32" font-family="'Geist Mono', Consolas, monospace" font-size="11" fill="#52525b">[11:42:01] Forwarded to mobile companion</text>
        <text x="0" y="50" font-family="'Geist Mono', Consolas, monospace" font-size="11" fill="#52525b">[11:42:02] Phone client buzzed (ID 9001)</text>
        <text x="0" y="68" font-family="'Geist Mono', Consolas, monospace" font-size="11" fill="#52525b">[11:42:03] Lockscreen notification visible</text>
        <text x="0" y="86" font-family="'Geist Mono', Consolas, monospace" font-size="11" fill="#22c55e">✓ Decision arrived: ALLOW (0.42s)</text>
      </g>
    </g>
  </g>

  <!-- Panel 2: Kyber Gateway & Pairing Engine (Middle) -->
  <g transform="translate(426, 100)">
    <rect width="348" height="400" rx="8" fill="#121316" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <path d="M 0 8 Q 0 0 8 0 L 340 0 Q 348 0 348 8 L 348 36 L 0 36 Z" fill="#18191d" />
    <text x="18" y="22" font-family="'Geist Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#a1a1aa">PAIRING &amp; DISCOVERY GATEWAY</text>

    <!-- QR Code Graphic Mockup -->
    <g transform="translate(94, 56)">
      <rect width="160" height="160" rx="8" fill="#ffffff" />
      <!-- Stylized QR blocks -->
      <rect x="14" y="14" width="44" height="44" fill="#0c0d0e" />
      <rect x="22" y="22" width="28" height="28" fill="#ffffff" />
      <rect x="28" y="28" width="16" height="16" fill="#0c0d0e" />

      <rect x="102" y="14" width="44" height="44" fill="#0c0d0e" />
      <rect x="110" y="22" width="28" height="28" fill="#ffffff" />
      <rect x="116" y="28" width="16" height="16" fill="#0c0d0e" />

      <rect x="14" y="102" width="44" height="44" fill="#0c0d0e" />
      <rect x="22" y="110" width="28" height="28" fill="#ffffff" />
      <rect x="28" y="116" width="16" height="16" fill="#0c0d0e" />

      <!-- Center Logo Accent on QR -->
