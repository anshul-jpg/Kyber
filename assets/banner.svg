        <text x="68" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#f87171">DENY</text>

        <!-- Allow Button -->
        <rect x="150" width="136" height="42" rx="6" fill="#007acc" />
        <text x="218" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#ffffff">ALLOW</text>
      </g>
      <text x="157" y="186" text-anchor="middle" font-family="'Geist Mono', Consolas, monospace" font-size="9" fill="#52525b">HAPTIC TOUCH ENABLED • TIMEOUT: 120S</text>
    </g>

    <!-- Bottom Mobile Toolbar -->
    <g transform="translate(18, 270)">
      <rect width="314" height="110" rx="8" fill="#18191d" stroke="rgba(255,255,255,0.08)" />
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa">REMOTE DIRECTIVES</text>

      <!-- Voice Directive Button -->
      <rect x="16" y="38" width="135" height="36" rx="6" fill="#27272a" stroke="rgba(255,255,255,0.06)" />
      <circle cx="32" cy="56" r="4" fill="#a855f7" />
      <text x="44" y="61" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e4e4e7">Voice Note</text>

      <!-- Emergency Abort Button -->
      <rect x="163" y="38" width="135" height="36" rx="6" fill="#2d1215" stroke="#ef4444" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="179" cy="56" r="4" fill="#ef4444" />
      <text x="191" y="61" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#fca5a5">Abort Agent</text>

      <!-- Host Status -->
      <text x="16" y="96" font-family="'Geist Mono', Consolas, monospace" font-size="10" fill="#71717a">Host: WIN11-DESK • CPU: 14% • RAM: 42%</text>
    </g>
  </g>
</svg>
