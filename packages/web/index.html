<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none'%3E%3Crect x='18' y='16' width='13' height='68' rx='2.5' fill='%23ffffff'/%3E%3Cpath d='M52 16 L31 50 L52 84 H39 L22 50 L39 16 H52 Z' fill='%23ffffff'/%3E%3Cpath d='M82 16 L61 50 L82 84 H69 L52 50 L69 16 H82 Z' fill='%23ffffff'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>kyber.</title>
    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        height: 100%;
        width: 100%;
        background-color: #000000;
        color: #ededed;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        font-variant-numeric: tabular-nums;
        text-wrap: pretty;
        overflow: hidden;
      }
      #root {
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
      }

      /* Tactile press feedback helper */
      button, [role="button"] {
        touch-action: manipulation;
        transition: transform 100ms cubic-bezier(0.2, 0, 0, 1), opacity 100ms ease;
      }
      button:active:not(:disabled), [role="button"]:active {
        transform: scale(0.96);
      }

      /* Obsidian mobile scrollbar */
      ::-webkit-scrollbar {
        width: 3px;
        height: 3px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 3px;
      }

      /* Standardized Scalable Mobile Typography */
      .prose-antigravity {
        color: #d4d4d8;
        font-size: clamp(13.5px, 3.8vw, 15px);
        line-height: 1.6;
        letter-spacing: -0.01em;
        word-break: normal;
        overflow-wrap: break-word;
        max-width: 100%;
      }

      .prose-antigravity h1 {
        font-size: clamp(17px, 4.5vw, 20px);
        font-weight: 700;
        color: #ffffff;
        margin: 20px 0 10px 0;
        line-height: 1.35;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding-bottom: 6px;
      }

      .prose-antigravity h2 {
        font-size: clamp(15.5px, 4vw, 17.5px);
        font-weight: 600;
        color: #ffffff;
        margin: 18px 0 8px 0;
        line-height: 1.35;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        padding-bottom: 4px;
      }

      .prose-antigravity h3 {
        font-size: clamp(14px, 3.6vw, 15.5px);
        font-weight: 600;
        color: #f4f4f5;
        margin: 14px 0 6px 0;
        line-height: 1.4;
      }

      .prose-antigravity p {
        margin: 8px 0;
        line-height: 1.6;
      }

      .prose-antigravity ul,
      .prose-antigravity ol {
        margin: 8px 0;
        padding-left: 22px;
      }

      .prose-antigravity li {
        margin: 4px 0;
        line-height: 1.55;
      }

      .prose-antigravity strong {
        font-weight: 600;
        color: #ffffff;
      }

      .prose-antigravity a {
        color: #ffffff;
        text-decoration: underline;
        text-decoration-color: rgba(255, 255, 255, 0.4);
        text-underline-offset: 3px;
        word-break: break-all;
      }

      .prose-antigravity hr {
        border: none;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        margin: 16px 0;
      }

      .prose-antigravity blockquote {
        border-left: 2px solid rgba(255, 255, 255, 0.4);
        background: rgba(255, 255, 255, 0.04);
        padding: 8px 12px;
        margin: 12px 0;
        border-radius: 0 6px 6px 0;
        color: #a1a1aa;
      }

      .prose-antigravity code {
        font-family: 'Geist Mono', Consolas, 'Fira Code', monospace;
        font-size: 12.5px;
        background: rgba(255, 255, 255, 0.06);
        color: #f4f4f5;
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .prose-antigravity pre {
        margin: 12px 0;
        padding: 12px 14px;
        background: #181818;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        max-width: 100%;
      }

      .prose-antigravity pre code {
        background: transparent;
        padding: 0;
        color: #e4e4e7;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre;
        border: none;
      }

      /* Responsive Touch-Scrollable Markdown Tables */
      .prose-antigravity table {
        display: block;
        width: 100%;
        max-width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        border-collapse: collapse;
        margin: 14px 0;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        background: #181818;
      }

      .prose-antigravity thead {
        background: rgba(255, 255, 255, 0.04);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .prose-antigravity th {
        padding: 10px 14px;
        font-size: 11.5px;
        font-weight: 600;
        color: #f4f4f5;
        text-align: left;
        white-space: nowrap;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        border-right: 1px solid rgba(255, 255, 255, 0.06);
      }

      .prose-antigravity td {
        padding: 10px 14px;
        font-size: 13.5px;
        line-height: 1.5;
        color: #d4d4d8;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        border-right: 1px solid rgba(255, 255, 255, 0.06);
        min-width: 135px;
        white-space: normal;
        word-break: normal;
        overflow-wrap: normal;
        vertical-align: top;
      }

      .prose-antigravity td:first-child {
        font-weight: 500;
        color: #ffffff;
        min-width: 105px;
      }

      .prose-antigravity tr:last-child td {
        border-bottom: none;
      }

      .prose-antigravity td:last-child,
      .prose-antigravity th:last-child {
        border-right: none;
      }

      .prose-antigravity tr:nth-child(even) td {
        background: rgba(255, 255, 255, 0.02);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
